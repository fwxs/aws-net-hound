[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audit-local",
    "crates/aws-deploy",
]

[workspace.dependencies]
aws-config = "1.10.1"
aws-sdk-ec2 = "1.246.0"
aws-sdk-sts = "1.110.0"
aws-smithy-async = "1.3.0"
aws-smithy-runtime-api = "1.14.0"
neo4rs = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_norway = "0.9.42"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
aws-smithy-mocks = "0.3.0"
pretty_assertions = "1.4.1"
testcontainers = "0.28.0"
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
