services:
  neo4j:
    image: neo4j:5.26.29-community
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      HEALTHCHECK_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$HEALTHCHECK_PASSWORD\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 120s
    # Ephemeral by default: `docker compose down` discards the graph.
    # Uncomment below (and the top-level `volumes:` block) to persist data
    # across restarts.
    # volumes:
    #   - neo4j_data:/data

# volumes:
#   neo4j_data:
