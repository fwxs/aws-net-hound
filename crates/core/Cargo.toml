[package]
name = "core"
version = "0.1.0"
edition = "2021"

[lib]
# `core` collides with the sysroot `core` crate in the extern prelude,
# breaking std macros (assert_eq!, tokio::test) inside this crate's own
# test binaries. Compile under a distinct crate name; package/directory
# name stays `core`.
name = "aws_net_hound_core"

[lints]
workspace = true

[dependencies]
aws-config = { workspace = true }
aws-sdk-ec2 = { workspace = true }
aws-sdk-sts = { workspace = true }
aws-smithy-async = { workspace = true }
aws-smithy-runtime-api = { workspace = true }
neo4rs = { workspace = true }
serde = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
aws-sdk-ec2 = { workspace = true, features = ["test-util"] }
aws-smithy-mocks = { workspace = true }
pretty_assertions = { workspace = true }
testcontainers = { workspace = true }
proptest = { workspace = true }
